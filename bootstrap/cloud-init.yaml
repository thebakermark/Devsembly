#cloud-config
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/sbin/run-devsembly-bootstrap
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      export DEVSEMBLY_REPO="https://github.com/thebakermark/Devsembly.git"
      export DEVSEMBLY_REF="build/genesis-bootstrap-v1"
      install -d -m 0755 /var/lib/devsembly-bootstrap
      curl -fsSL "https://raw.githubusercontent.com/thebakermark/Devsembly/${DEVSEMBLY_REF}/bootstrap/devsembly-bootstrap.sh" \
        -o /var/lib/devsembly-bootstrap/devsembly-bootstrap.sh
      chmod 0755 /var/lib/devsembly-bootstrap/devsembly-bootstrap.sh
      exec /var/lib/devsembly-bootstrap/devsembly-bootstrap.sh

runcmd:
  - [bash, -lc, '/usr/local/sbin/run-devsembly-bootstrap']

final_message: "Devsembly cloud-init finished. Review /var/log/devsembly-bootstrap.log and run sudo devsembly-validate."
