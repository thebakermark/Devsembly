name: Feature request
description: Propose a new Devsembly capability
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
  - type: dropdown
    id: agent
    attributes:
      label: Agent suitability
      options: ["Agent-ready", "Agent-assisted", "Human-only", "Unknown"]
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, data, and documentation considerations
