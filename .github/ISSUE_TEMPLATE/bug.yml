name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or other evidence
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Critical", "High", "Medium", "Low"]
    validations:
      required: true
