name: Organizational Genome CI

on:
  pull_request:
    paths:
      - "docs/architecture/organizational-genome/**"
      - ".github/workflows/organizational-genome-ci.yml"
  push:
    branches: [main]
    paths:
      - "docs/architecture/organizational-genome/**"
      - ".github/workflows/organizational-genome-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema PyYAML
      - name: Validate JSON, YAML, and JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema.validators import validator_for

          root = Path("docs/architecture/organizational-genome")
          for path in root.rglob("*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(data, dict) and "$schema" in data:
                  validator_for(data).check_schema(data)
              print(f"validated {path}")
          for path in root.rglob("*.yml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          for path in root.rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          PY
