name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive checksums
        run: |
          git archive --format=tar.gz --output=devsembly-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum devsembly-${GITHUB_REF_NAME}.tar.gz > devsembly-${GITHUB_REF_NAME}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            devsembly-${{ github.ref_name }}.tar.gz
            devsembly-${{ github.ref_name }}.sha256
