name: bug-fix
version: 0.1.0
stages:
  - id: reproduce
    agent: defect-analyst
    outputs: [reproduction, suspected_scope]
  - id: regression_test
    agent: test-engineer
    needs: [reproduce]
    requirement: test_must_fail_before_fix
  - id: implement
    agent: coding-agent
    needs: [regression_test]
  - id: validate
    agent: quality-agent
    needs: [implement]
    checks: [targeted_tests, full_regression, security_scans]
  - id: review
    agent: independent-reviewer
    needs: [validate]
    gate: must_approve
  - id: pull_request
    agent: github-agent
    needs: [review]
    action: create_draft_pr
policy:
  max_retries_per_stage: 3
  self_approval: forbidden
