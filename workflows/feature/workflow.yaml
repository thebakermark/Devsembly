name: feature
version: 0.1.0
purpose: Deliver a new feature through requirements, architecture, implementation, review and preview validation.
inputs:
  - issue
  - repository
stages:
  - id: requirements
    agent: requirements-analyst
    outputs: [requirements, acceptance_criteria, edge_cases]
  - id: architecture
    agent: solution-architect
    needs: [requirements]
    outputs: [technical_design, threat_model, implementation_plan]
  - id: architecture_review
    agent: architecture-reviewer
    needs: [architecture]
    gate: must_approve
  - id: implementation
    agent: engineering-director
    needs: [architecture_review]
    strategy: isolated_worktrees
  - id: validation
    agent: quality-director
    needs: [implementation]
    checks: [format, lint, typecheck, unit, integration, migrations, container_build]
  - id: security
    agent: security-reviewer
    needs: [implementation]
    checks: [gitleaks, semgrep, trivy]
  - id: independent_review
    agent: code-reviewer
    needs: [validation, security]
    gate: must_approve
  - id: pull_request
    agent: github-agent
    needs: [independent_review]
    action: create_draft_pr
  - id: preview
    agent: deployment-agent
    needs: [pull_request]
    action: deploy_preview
  - id: preview_validation
    agent: browser-test-agent
    needs: [preview]
    checks: [smoke, playwright, accessibility]
  - id: human_approval
    agent: approval-service
    needs: [preview_validation]
    gate: human_required
policy:
  max_retries_per_stage: 3
  direct_main_push: forbidden
  self_approval: forbidden
